[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A tool-using coding agent over MCP, with a benchmark of seeded bugs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kareem Ahmed" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=patchpilot --cov-report=term-missing"
